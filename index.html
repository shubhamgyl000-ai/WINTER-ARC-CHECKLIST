<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winter Arc Checklist & Admin Dashboard</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --admin-accent: #a855f7;
      --admin-hover: #9333ea;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #30363d;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .ip-badge {
      display: inline-block;
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-family: monospace;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.95rem;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn-admin {
      background: var(--admin-accent);
      color: #fff;
    }

    .btn-admin:hover {
      background: var(--admin-hover);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: #21262d;
      color: var(--text-main);
    }

    .toggle-link {
      text-align: center;
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .toggle-link span {
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
    }

    .alert {
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid var(--success);
      color: var(--success);
    }

    /* Checklist & Dashboard Styles */
    .checklist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .checklist-item {
      display: flex;
      align-items: center;
      background: #0d1117;
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border 0.2s;
    }

    .checklist-item:hover {
      border-color: var(--accent);
    }

    .checklist-item input[type="checkbox"] {
      margin-right: 12px;
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .checklist-item.completed span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .add-habit-box {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .add-habit-box input {
      flex: 1;
    }

    .add-habit-box button {
      width: auto;
      padding: 0 16px;
    }

    /* Admin Cards & Progress Display */
    .user-card {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .user-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .user-name {
      font-weight: bold;
      color: var(--accent);
    }

    .user-ip {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    .progress-bar-bg {
      background: #21262d;
      border-radius: 10px;
      height: 8px;
      width: 100%;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      background: var(--success);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .habit-detail-list {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      font-size: 0.85rem;
    }

    .habit-detail-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .habit-detail-item.done {
      color: var(--text-main);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 id="headerTitle">❄️ WINTER ARC</h1>
      <div id="ipContainer" class="ip-badge">Detecting IP...</div>
    </div>

    <div id="alertBox" class="alert"></div>

    <!-- REGISTER VIEW -->
    <div id="registerView">
      <div class="form-group">
        <label for="regUsername">Choose Login ID</label>
        <input type="text" id="regUsername" placeholder="e.g. ArcRunner99">
      </div>
      <div class="form-group">
        <label for="regPassword">Choose Password</label>
        <input type="password" id="regPassword" placeholder="••••••••">
      </div>
      <button class="btn" onclick="registerUser()">Register & Bind to IP</button>
      <div class="toggle-link">
        Already registered? <span onclick="switchView('login')">Login here</span>
      </div>
    </div>

    <!-- LOGIN VIEW -->
    <div id="loginView" class="hidden">
      <div class="form-group">
        <label for="loginUsername">Login ID (Use 'admin' for Admin Access)</label>
        <input type="text" id="loginUsername" placeholder="Enter Login ID">
      </div>
      <div class="form-group">
        <label for="loginPassword">Password (Default admin pass: admin123)</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
      </div>
      <button class="btn" onclick="loginUser()">Login</button>
      <div class="toggle-link">
        Need to create an account? <span onclick="switchView('register')">Register</span>
      </div>
    </div>

    <!-- USER DASHBOARD VIEW -->
    <div id="dashboardView" class="hidden">
      <div class="checklist-header">
        <div>
          <span style="font-size:0.8rem; color:var(--text-muted);">Active User</span>
          <div id="activeUserDisplay" style="font-weight:bold; color:var(--accent);"></div>
        </div>
        <button class="btn btn-secondary" style="width:auto; padding:6px 12px; font-size:0.8rem;" onclick="logout()">Logout</button>
      </div>

      <div id="checklistItems"></div>

      <div class="add-habit-box">
        <input type="text" id="newHabitInput" placeholder="Add custom goal...">
        <button class="btn" onclick="addCustomHabit()">Add</button>
      </div>
    </div>

    <!-- ADMIN DASHBOARD VIEW -->
    <div id="adminDashboardView" class="hidden">
      <div class="checklist-header">
        <div>
          <span style="font-size:0.8rem; color:var(--admin-accent); font-weight:bold;">👑 ADMIN PORTAL</span>
          <div style="font-size:0.85rem; color:var(--text-muted);">Registered Users Progress Overview</div>
        </div>
        <button class="btn btn-secondary" style="width:auto; padding:6px 12px; font-size:0.8rem;" onclick="logout()">Logout</button>
      </div>

      <div id="adminUserList"></div>
    </div>
  </div>

  <script>
    let currentIp = "UNKNOWN_IP";
    let activeUser = null;
    let isAdmin = false;

    const defaultHabits = [
      "Wake up at 5:00 AM",
      "45+ mins intense workout / weightlifting",
      "Drink 3+ Liters of water",
      "Read 10 pages of self-improvement",
      "Zero alcohol & zero junk food",
      "Track daily discipline log"
    ];

    async function hashPassword(password) {
      const msgBuffer = new TextEncoder().encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function init() {
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        currentIp = data.ip;
      } catch (err) {
        currentIp = "127.0.0.1";
      }
      document.getElementById('ipContainer').innerText = `IP: ${currentIp}`;

      await initAdminAccount();

      const session = JSON.parse(sessionStorage.getItem('winter_arc_session'));
      if (session) {
        activeUser = session.username;
        isAdmin = session.isAdmin || false;
        if (isAdmin) {
          showAdminDashboard();
        } else if (session.ip === currentIp) {
          showDashboard();
        }
      }
    }

    async function initAdminAccount() {
      const storageKey = `winter_arc_users_${currentIp}`;
      const users = JSON.parse(localStorage.getItem(storageKey) || '{}');
      if (!users['admin']) {
        users['admin'] = {
          password: await hashPassword('admin123'),
          isAdmin: true,
          habits: []
        };
        localStorage.setItem(storageKey, JSON.stringify(users));
      }
    }

    function showAlert(msg, type = 'error') {
      const alertBox = document.getElementById('alertBox');
      alertBox.className = `alert alert-${type}`;
      alertBox.innerText = msg;
      alertBox.style.display = 'block';
      setTimeout(() => alertBox.style.display = 'none', 4000);
    }

    function switchView(view) {
      document.getElementById('registerView').classList.add('hidden');
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('adminDashboardView').classList.add('hidden');

      if (view === 'register') document.getElementById('registerView').classList.remove('hidden');
      if (view === 'login') document.getElementById('loginView').classList.remove('hidden');
      if (view === 'dashboard') document.getElementById('dashboardView').classList.remove('hidden');
      if (view === 'admin') document.getElementById('adminDashboardView').classList.remove('hidden');
    }

    async function registerUser() {
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;

      if (!username || !password) return showAlert('Please fill out all fields.');
      if (username.toLowerCase() === 'admin') return showAlert('Username "admin" is reserved.');

      const storageKey = `winter_arc_users_${currentIp}`;
      const users = JSON.parse(localStorage.getItem(storageKey) || '{}');

      if (users[username]) return showAlert('Username already exists on this IP!');

      const passwordHash = await hashPassword(password);
      users[username] = {
        password: passwordHash,
        isAdmin: false,
        habits: defaultHabits.map(task => ({ text: task, completed: false }))
      };

      localStorage.setItem(storageKey, JSON.stringify(users));
      showAlert('Account registered successfully! Please login.', 'success');
      switchView('login');
    }

    async function loginUser() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      const passwordHash = await hashPassword(password);

      let foundUser = null;
      let matchedIp = currentIp;

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('winter_arc_users_')) {
          const users = JSON.parse(localStorage.getItem(key) || '{}');
          if (users[username]) {
            foundUser = users[username];
            matchedIp = key.replace('winter_arc_users_', '');
            break;
          }
        }
      }

      if (!foundUser) return showAlert('User ID not found.');
      if (foundUser.password !== passwordHash) return showAlert('Incorrect password.');

      activeUser = username;
      isAdmin = foundUser.isAdmin || false;

      sessionStorage.setItem('winter_arc_session', JSON.stringify({
        username,
        ip: matchedIp,
        isAdmin
      }));

      if (isAdmin) {
        showAdminDashboard();
      } else {
        showDashboard();
      }
    }

    function showDashboard() {
      document.getElementById('activeUserDisplay').innerText = activeUser;
      renderHabits();
      switchView('dashboard');
    }

    function showAdminDashboard() {
      renderAdminView();
      switchView('admin');
    }

    function getUserData() {
      const storageKey = `winter_arc_users_${currentIp}`;
      const users = JSON.parse(localStorage.getItem(storageKey) || '{}');
      return users[activeUser] || { habits: [] };
    }

    function saveUserData(data) {
      const storageKey = `winter_arc_users_${currentIp}`;
      const users = JSON.parse(localStorage.getItem(storageKey) || '{}');
      users[activeUser] = data;
      localStorage.setItem(storageKey, JSON.stringify(users));
    }

    function renderHabits() {
      const data = getUserData();
      const container = document.getElementById('checklistItems');
      container.innerHTML = '';

      data.habits.forEach((habit, index) => {
        container.innerHTML += `
          <div class="checklist-item ${habit.completed ? 'completed' : ''}" onclick="toggleHabit(${index})">
            <input type="checkbox" ${habit.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleHabit(${index})">
            <span>${habit.text}</span>
          </div>
        `;
      });
    }

    function toggleHabit(index) {
      const data = getUserData();
      data.habits[index].completed = !data.habits[index].completed;
      saveUserData(data);
      renderHabits();
    }

    function addCustomHabit() {
      const input = document.getElementById('newHabitInput');
      const text = input.value.trim();
      if (!text) return;

      const data = getUserData();
      data.habits.push({ text, completed: false });
      saveUserData(data);
      input.value = '';
      renderHabits();
    }

    function renderAdminView() {
      const container = document.getElementById('adminUserList');
      container.innerHTML = '';

      let totalUsers = 0;

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('winter_arc_users_')) {
          const ip = key.replace('winter_arc_users_', '');
          const users = JSON.parse(localStorage.getItem(key) || '{}');

          Object.keys(users).forEach(uName => {
            if (uName === 'admin') return;
            totalUsers++;

            const user = users[uName];
            const totalHabits = user.habits.length;
            const completedHabits = user.habits.filter(h => h.completed).length;
            const percentage = totalHabits > 0 ? Math.round((completedHabits / totalHabits) * 100) : 0;

            let habitDetailsHtml = user.habits.map(h => `
              <div class="habit-detail-item ${h.completed ? 'done' : ''}">
                <span>${h.completed ? '✅' : '❌'}</span>
                <span>${h.text}</span>
              </div>
            `).join('');

            container.innerHTML += `
              <div class="user-card">
                <div class="user-card-header">
                  <span class="user-name">👤 ${uName}</span>
                  <span class="user-ip">IP: ${ip}</span>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--text-muted); margin-top:4px;">
                  <span>Progress: ${completedHabits}/${totalHabits} completed</span>
                  <span style="font-weight:bold; color:var(--success);">${percentage}%</span>
                </div>
                <div class="progress-bar-bg">
                  <div class="progress-bar-fill" style="width: ${percentage}%;"></div>
                </div>
                <div class="habit-detail-list">
                  ${habitDetailsHtml || '<div style="color:var(--text-muted);">No goals registered.</div>'}
                </div>
              </div>
            `;
          });
        }
      }

      if (totalUsers === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:20px;">No registered user accounts found.</div>`;
      }
    }

    function logout() {
      activeUser = null;
      isAdmin = false;
      sessionStorage.removeItem('winter_arc_session');
      switchView('login');
    }

    init();
  </script>
</body>
</html>
